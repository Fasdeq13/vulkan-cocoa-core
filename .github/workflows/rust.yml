name: Build macOS Native

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release
      run: cargo build --release

    - name: Copy libraries for output
      run: |
        cp target/release/libvulkan_cocoa_core_bridge.dylib ./
        cp target/release/libvulkan_cocoa_core_bridge.a ./

    - name: Upload Compiled Libraries
      uses: actions/upload-artifact@v4
      with:
        name: compiled-libraries
        path: |
          libvulkan_cocoa_core_bridge.dylib
          libvulkan_cocoa_core_bridge.a
